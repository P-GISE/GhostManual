name: Document version selection races
on:
  push:
    branches: ["test/document-version-races"]
permissions:
  contents: read
jobs:
  security:
    uses: ./.github/workflows/security-gate.yml
  regressions:
    needs: ["security"]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
        env:
          POSTGRES_USER: ghostmanual
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ghostmanual_latency_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ghostmanual -d ghostmanual_latency_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://ghostmanual:ci-only-password@localhost:5432/ghostmanual_latency_test
      APP_ORIGIN: http://localhost:3200
      AI_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.1
          cache: npm
      - run: npm ci
      - name: Format race tests on ephemeral runner
        run: npx biome check --write tests/e2e/document-version-race.spec.ts
      - name: Retain formatted test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: version-race-review-source
          path: tests/e2e/document-version-race.spec.ts
          retention-days: 3
      - run: npx biome check tests/performance/latency-metrics.ts tests/performance/latency-recorder.ts tests/performance/setup-latency.ts tests/performance/user-flows.spec.ts tests/unit/latency-metrics.test.ts tests/performance/playwright.config.ts
      - run: npm test -- tests/unit/latency-metrics.test.ts tests/unit/document-progress.test.ts
      - run: node --input-type=module -e 'import setup from "./tests/performance/setup-latency.ts"; await setup()'
      - run: npm run build
      - run: npx playwright install chromium
      - name: Verify focused request and authority regressions
        run: npx playwright test tests/e2e/document-version-race.spec.ts tests/e2e/document-progress.spec.ts tests/e2e/document-versions.spec.ts --project desktop
      - name: Remove only the selection-generation guard on the ephemeral runner
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = "src/components/FileVersions.tsx";
          const source = readFileSync(path, "utf8");
          const guard = "      if (selectionVersion !== selectionRequest.current) return;";
          if (source.split(guard).length !== 2) throw new Error("Expected one selection guard");
          writeFileSync(path, source.replace(guard, ""));
          NODE
      - run: npm run build
      - name: Confirm the race test detects the missing guard
        run: |
          npx playwright test tests/e2e/document-version-race.spec.ts --project desktop --grep "detail completes while another version selection is pending" --reporter=json > mutation-results.json && exit 1
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync } from "node:fs";
          const result = JSON.parse(readFileSync("mutation-results.json", "utf8"));
          const specs = suite => [...(suite.specs ?? []), ...(suite.suites ?? []).flatMap(specs)];
          const tests = result.suites.flatMap(specs).flatMap(spec => spec.tests);
          assert.equal(result.stats.unexpected, 1);
          assert.equal(tests.length, 1);
          assert(tests[0].results.some(run => run.status === "failed" && run.error?.message.includes("toBeDisabled")));
          console.log("Expected assertion failure confirmed: stale completion enabled writing without the guard.");
          NODE
