name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  security:
    uses: ./.github/workflows/security-gate.yml
  verify:
    needs: ["security"]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
        env:
          POSTGRES_USER: ghostmanual
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ghostmanual_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ghostmanual -d ghostmanual_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://ghostmanual:ci-only-password@localhost:5432/ghostmanual_test
      APP_ORIGIN: http://localhost:3200
      IP_HASH_SECRET: ci-only-hash-secret-at-least-32-characters
      AI_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.20.0
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Verify app-only deployment guards
        run: |
          python3 scripts/test_deploy_poll.py
          python3 -I -B -m unittest discover -s deploy/event -p "test_*.py" -v
      - run: npm run db:migrate
      - run: npm run test:integration
      - run: npm run build
      # shortcut: use ubuntu-24.04 Chromium libraries; install explicit dependencies if the runner changes.
      - run: npx playwright install chromium
      - run: npm run test:e2e
      - name: Verify workspace session handoff without database writes
        run: npx playwright test --config playwright.session.config.ts --reporter=line
      - name: Verify HTTPS cookie transport and cached Next navigation
        run: npx playwright test --config playwright.transport.config.ts --reporter=line
      - run: npm run test:accessibility
      - name: Build deployment image without credentials
        run: docker build --label org.opencontainers.image.revision=${{ github.sha }} -t ghostmanual:${{ github.sha }} .
      - name: Export verified deployment image
        if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref == 'refs/heads/feat/ghostmanual-mvp')
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          docker save "ghostmanual:$RELEASE_SHA" | gzip -n > ghostmanual-image.tar.gz
          (cd deploy/event && python3 -B -c 'import entry,sys; print(entry.image_info(sys.argv[1],sys.argv[2]))' ../../ghostmanual-image.tar.gz "$RELEASE_SHA")
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: github.event_name == 'push' && github.ref == 'refs/heads/feat/ghostmanual-mvp'
        with:
          name: ghostmanual-event-image-${{ github.sha }}
          path: ghostmanual-image.tar.gz
          retention-days: 1
          if-no-files-found: error
