name: Isolated document latency
on:
  push:
    branches: ["chore/document-latency-baseline", "fix/document-read-roundtrips"]
permissions:
  contents: read
jobs:
  security:
    uses: ./.github/workflows/security-gate.yml
  measure:
    needs: ["security"]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
        env:
          POSTGRES_USER: ghostmanual
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ghostmanual_latency_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ghostmanual -d ghostmanual_latency_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://ghostmanual:ci-only-password@localhost:5432/ghostmanual_latency_test
      APP_ORIGIN: http://localhost:3200
      AI_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.1
          cache: npm
      - run: npm ci
      - run: npx biome check tests/performance/latency-metrics.ts tests/performance/latency-recorder.ts tests/performance/setup-latency.ts tests/performance/user-flows.spec.ts tests/unit/latency-metrics.test.ts tests/performance/playwright.config.ts
      - run: npm test -- tests/unit/latency-metrics.test.ts
      - run: npm run build
      - run: npx playwright install chromium
      - name: Measure one isolated desktop user
        run: npx playwright test --config tests/performance/playwright.config.ts
      - name: Retain synthetic timing rows only
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: user-flow-latency-${{ github.run_id }}-${{ github.run_attempt }}
          path: user-flow-latency.json
          retention-days: 7
          if-no-files-found: warn
