name: Paired document latency
on:
  push:
    branches: ["fix/document-read-roundtrips"]
permissions:
  contents: read
jobs:
  security:
    uses: ./.github/workflows/security-gate.yml
  paired:
    needs: ["security"]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      baseline-db:
        image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
        env:
          POSTGRES_USER: ghostmanual
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ghostmanual_latency_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ghostmanual -d ghostmanual_latency_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
      candidate-db:
        image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
        env:
          POSTGRES_USER: ghostmanual
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: ghostmanual_latency_test
        ports: ["5433:5432"]
        options: >-
          --health-cmd "pg_isready -U ghostmanual -d ghostmanual_latency_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      APP_ORIGIN: http://localhost:3200
      AI_ENABLED: "false"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 41dd4e70abc5aba556b1c4f75938c96749ac2a77
          path: baseline-app
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.sha }}
          path: candidate-app
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26.13.1
      - run: npm ci
        working-directory: baseline-app
      - run: npm ci
        working-directory: candidate-app
      - run: npx playwright install chromium
        working-directory: candidate-app
      - run: npm run build
        working-directory: baseline-app
      - run: npm run build
        working-directory: candidate-app
      - name: Measure baseline on this runner
        working-directory: baseline-app
        env:
          DATABASE_URL: postgresql://ghostmanual:ci-only-password@localhost:5432/ghostmanual_latency_test
        run: npx playwright test --config tests/performance/playwright.config.ts
      - name: Measure candidate on the same runner
        working-directory: candidate-app
        env:
          DATABASE_URL: postgresql://ghostmanual:ci-only-password@localhost:5433/ghostmanual_latency_test
        run: npx playwright test --config tests/performance/playwright.config.ts
      - name: Verify checked-out provenance and matching harnesses
        if: always()
        run: |
          node --input-type=module <<'NODE'
          import assert from "node:assert/strict";
          import { readFileSync, writeFileSync, existsSync } from "node:fs";
          import { createHash } from "node:crypto";
          import { execFileSync } from "node:child_process";
          const folders = ["baseline-app", "candidate-app"];
          const expected = ["41dd4e70abc5aba556b1c4f75938c96749ac2a77", process.env.GITHUB_SHA];
          const cases = [];
          const harnessFiles = [
            "tests/performance/user-flows.spec.ts",
            "tests/performance/latency-recorder.ts",
            "tests/performance/latency-metrics.ts",
            "tests/performance/playwright.config.ts",
            "tests/performance/setup-latency.ts",
            "tests/fixtures/documents/native/build.ts",
            "tests/e2e/helpers.ts",
          ];
          for (const [index, folder] of folders.entries()) {
            const path = folder + "/user-flow-latency.json";
            if (!existsSync(path)) continue;
            const checkedOut = execFileSync("git", ["-C", folder, "rev-parse", "HEAD"], { encoding: "utf8" }).trim();
            assert.equal(checkedOut, expected[index]);
            const data = JSON.parse(readFileSync(path, "utf8"));
            data.eventCommit = data.commit;
            data.commit = checkedOut;
            data.comparisonOrder = index + 1;
            data.harnessHashes = Object.fromEntries(harnessFiles.map(file => [
              file, createHash("sha256").update(readFileSync(folder + "/" + file)).digest("hex"),
            ]));
            writeFileSync(path, JSON.stringify(data, null, 2));
            cases.push(data);
          }
          assert.equal(cases.length, 2);
          assert.deepEqual(cases[0].harnessHashes, cases[1].harnessHashes);
          assert.equal(cases[0].cpuModel, cases[1].cpuModel);
          assert.equal(cases[0].cpuCount, cases[1].cpuCount);
          for (const data of cases) {
            assert.equal(data.completed, true);
            assert.equal(data.rows.length, 775);
            assert.equal(data.summary.length, 25);
            assert(data.summary.every(group => group.samples === 30));
          }
          NODE
      - name: Retain paired synthetic measurements
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: paired-user-flow-latency-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            baseline-app/user-flow-latency.json
            candidate-app/user-flow-latency.json
          retention-days: 7
          if-no-files-found: warn
