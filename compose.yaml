name: ghostmanual
services:
  app:
    image: ${GHOSTMANUAL_IMAGE:?Set a verified immutable GhostManual image}
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:3200:3200"
    environment:
      DATABASE_URL: postgresql://ghostmanual_app:${APP_DATABASE_PASSWORD:?Set restricted runtime database password}@db:5432/ghostmanual
      APP_ORIGIN: ${APP_ORIGIN:?Set public HTTPS origin}
      TRUST_CLOUDFLARE: "true"
      IP_HASH_SECRET: ${IP_HASH_SECRET:?Set random hashing secret}
      AI_ENABLED: ${AI_ENABLED:-false}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-sonnet-5-5}
      AI_DAILY_LIMIT: ${AI_DAILY_LIMIT:-100}
      MAIL_DRIVER: ${MAIL_DRIVER:-smtp}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_APP_PASSWORD: ${SMTP_APP_PASSWORD:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      DEMO_RETENTION_DAYS: "7"
      NODE_OPTIONS: --max-old-space-size=256
    depends_on:
      db:
        condition: service_healthy
    mem_limit: 384m
    cpus: 0.75
    security_opt:
      - no-new-privileges:true
    logging:
      driver: journald
      options:
        tag: ghostmanual-app
  db:
    image: postgres:18.4-bookworm@sha256:882236b897e39051d2368c5ccc6cda944904723506b2dfc97f2a8f5bc9afa382
    restart: unless-stopped
    environment:
      POSTGRES_USER: ghostmanual
      POSTGRES_DB: ghostmanual
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set database password}
    command: ["postgres", "-c", "shared_buffers=32MB", "-c", "work_mem=2MB", "-c", "max_connections=20", "-c", "log_statement=none", "-c", "log_min_error_statement=panic", "-c", "log_parameter_max_length_on_error=0"]
    volumes:
      - database:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ghostmanual -d ghostmanual"]
      interval: 10s
      timeout: 5s
      retries: 5
    mem_limit: 128m
    cpus: 0.5
    shm_size: 32m
    logging:
      driver: journald
      options:
        tag: ghostmanual-db
volumes:
  database:
